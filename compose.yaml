name: Vaultwarden
services:
  Vaultwarden:
    container_name: Vaultwarden
    image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    restart: unless-stopped
    networks:
      - Vaultwarden
    environment:
      - DOMAIN=${DOMAIN}
      - SIGNUPS_ALLOWED=false # Deactivate this with "false" after you have created your account so that no strangers can register (Although ideally you wouldn't expose your Vaultwarden instance to the outside world anyways)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_TIMEOUT=${SMTP_TIMEOUT}
      - SMTP_SECURITY=${SMTP_SECURITY}
      - SMTP_PORT=${SMTP_PORT}
      - IP_HEADER=X-Forwarded-For
      - IP_HEADER_TRUSTED_PROXIES=172.16.5.0/24,10.0.11.10/32
    volumes:
      - ${DOCKER_VOLUMES}/Vaultwarden:/data/
      - /etc/localtime:/etc/localtime:ro

    user: "${UID}:${GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: journald

    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
          pids: 50

networks:
  Vaultwarden:
    name: Vaultwarden
    external: true
